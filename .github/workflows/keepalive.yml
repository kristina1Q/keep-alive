name: InstaBox 24/7 Keep-Alive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping and Keep-Alive InstaBox Machine
        env:
          API_KEY: ${{ secrets.INSTABOX_API_KEY }}
          MACHINE_ID: m_agqxblybofhlef2e5apl3qm4du
        run: |
          echo "Checking InstaBox machine status..."
          RESP=$(curl -s -H "Authorization: Bearer $API_KEY" -H "X-API-Key: $API_KEY" https://api.instabox.sh/v1/machines/$MACHINE_ID)
          STATE=$(echo "$RESP" | jq -r '.state // .machine.state // "unknown"')
          NAME=$(echo "$RESP" | jq -r '.name // .machine.name // "agentgc"')
          echo "Machine [$NAME] current state is: $STATE"

          if [ "$STATE" = "running" ]; then
            echo "Machine is running. Sending heartbeat to reset idle timer..."
            EXEC_RESP=$(curl -s -X POST \
              -H "Authorization: Bearer $API_KEY" \
              -H "X-API-Key: $API_KEY" \
              -H "Content-Type: application/json" \
              -d '{"cmd":"echo keepalive > /dev/null"}' \
              https://api.instabox.sh/v1/machines/$MACHINE_ID/exec)
            echo "Heartbeat response: $EXEC_RESP"
            echo "Keepalive heartbeat successful!"
          else
            echo "Machine is not running ($STATE). Sending start/wakeup command..."
            START_RESP=$(curl -s -X POST \
              -H "Authorization: Bearer $API_KEY" \
              -H "X-API-Key: $API_KEY" \
              -H "Content-Type: application/json" \
              -d '{}' \
              https://api.instabox.sh/v1/machines/$MACHINE_ID/start)
            echo "Start response: $START_RESP"
            echo "Wakeup command sent!"
          fi
